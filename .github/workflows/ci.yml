# 型別檢查＋單元測試＋網站 build；browser test 另一個 job（FakeEngine，不下載模型），切 4 份平行跑。
# e2e 不在這裡跑：要下載模型，而且受機器速度影響。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 原生跑 .ts（scripts/、vitest 的設定檔）
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run site:build

  # 切成 4 台機器各跑一份（Playwright --shard）：fullyParallel 讓切分以單一測試為單位，每份的測試數差不多。
  # 每份各自 npm ci、裝 Chromium、build、起 wrangler dev，約 45 秒的固定成本，所以份數再多也不會更快多少。
  # fail-fast: false：一份紅了其他份照跑完，一次看到所有失敗的測試。
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # fixtures 用 Playwright 內建的 Chromium（channel: 'chromium'）載入外掛
      - run: npx playwright install --with-deps chromium
      # 會先 build:e2e、site:build；globalSetup 用 wrangler dev 起本機 Worker
      # `--` 後面的參數接在 test:browser 最後的 playwright test 上
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          # artifact 名稱在同一次 run 裡不能重複
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # 合併到 main、上面兩個 job 都通過後自動部署網站與 Worker（ADR 0008）。
  # vars.DEPLOY_ENABLED 由 scripts/production-wizard.sh 第 5 步打開：D1 還沒建立、GitHub 的 token 還沒設好之前，合併不會部署。
  # CLOUDFLARE_API_TOKEN 只有部署網站、Worker 與 D1 的權限，Worker 的 secrets 只存在 Cloudflare，這裡讀不到。
  # 這把 token 寫得了 production D1，所以只給 wrangler 的 step，不放 job 層級：npm ci 時相依套件的 install script 和 build 讀不到它。
  deploy-site:
    needs: [check, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # client-side token 會出現在網頁原始碼，不是秘密，放 GitHub variables
      - run: npm run site:build
        env:
          PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          PUBLIC_PADDLE_ENVIRONMENT: production
      - run: npx wrangler deploy -c site/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # 先套用 migrations 再部署：中間有一段時間是新的資料表配舊的程式碼，所以 migration 只能加不能改（CODING_STANDARDS.md）。
  # 部署後打健康檢查，失敗就退回上一版程式碼（資料表結構不會跟著退）。cancel-in-progress: false：不中斷跑到一半的 migration。
  deploy-worker:
    needs: [check, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply naruhodo --remote -c worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy -c worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: 健康檢查
        id: health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://api.naruhodo.page/v1/health; then exit 0; fi
            sleep 10
          done
          echo "::error::部署後健康檢查失敗"
          exit 1
      - name: 健康檢查失敗就退回上一版
        if: failure() && steps.health.outcome == 'failure'
        run: npx wrangler rollback -c worker/wrangler.jsonc --message "CI 健康檢查失敗（${{ github.sha }}）" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
