<!doctype html>
<!--
  PROTOTYPE（不開側邊欄也能翻譯），用完即丟，不合回 main。
  問題：「啟動時開側邊欄」關掉的讀者，點圖示會發生什麼、翻譯中與出問題時在哪裡看到。
  三個結構不同的版本，用 ?variant=A|B|C（或底部切換列、← → 鍵）切換；?scenario= 選情境。
  直接用瀏覽器打開即可，不需要建置，沒有網路請求。翻譯、登入、付款都是假的；覆蓋層位置只是示意。
  已定案（grill）：卡住時開整頁 onboarding、看到一半出事不自動彈分頁、圖示上掛 !、解決後「回到漫畫」自動接著翻。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不開側邊欄翻譯 — prototype</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { box-sizing: border-box; }
  /* prototype 外框（控制列、切換列）刻意用深色，跟被評估的設計分開 */
  body { margin: 0; font-family: var(--naru-font-sans); background: #3b3a37; color: #eee; }
  .pt-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 16px; background: #1d1c1a; font-size: 13px; }
  .pt-bar button { border: 1px solid #555; background: #2a2926; color: #ddd; border-radius: 999px; padding: 3px 10px; font: inherit; cursor: pointer; }
  .pt-bar button[aria-pressed='true'] { background: #f2c94c; color: #1d1c1a; border-color: #f2c94c; font-weight: 700; }
  .pt-note { padding: 6px 16px; font-size: 12px; color: #f2c94c; background: #2a2926; }
  /* 單行、固定高：狀態變長也不會把下面的假瀏覽器往下推 */
  .pt-dump { padding: 4px 16px; font-family: var(--naru-font-mono); font-size: 11px; color: #9c9; background: #26251f; height: 24px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pt-stage { display: flex; justify-content: center; padding: 16px 16px 96px; }
  .pt-switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 4px; padding: 6px; background: #111; color: #fff; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 14px; }
  .pt-switcher button { width: 36px; height: 36px; border: 0; border-radius: 999px; background: #333; color: #fff; font-size: 18px; cursor: pointer; }
  .pt-switcher span { min-width: 300px; text-align: center; font-weight: 700; }

  /* ---------- 假瀏覽器 ---------- */
  .win { width: min(1200px, 100%); background: #fff; color: var(--naru-ink); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: #cfd5de; }
  .tab { padding: 7px 14px; border-radius: 8px 8px 0 0; background: #b9c1cd; font-size: 12px; cursor: pointer; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab[aria-selected='true'] { background: #eef1f5; font-weight: 700; }
  .toolbar { position: relative; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; background: #eef1f5; border-bottom: 1px solid #ccd; }
  .url { flex: 1; background: #fff; border-radius: 999px; padding: 4px 14px; color: #555; font-family: var(--naru-font-mono); font-size: 12px; }
  .ext { position: relative; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; display: grid; place-items: center; }
  .ext:hover { background: #dde3ea; }
  .ext img { width: 20px; height: 20px; }
  .badge { position: absolute; right: -2px; bottom: 0; min-width: 16px; height: 14px; padding: 0 3px; border-radius: 4px; font-size: 10px; line-height: 14px; font-weight: 700; color: #fff; text-align: center; }
  .badge--busy { background: var(--naru-highlight); }
  .badge--warn { background: #c0392b; }
  .badge--on { min-width: 8px; width: 8px; height: 8px; border-radius: 50%; right: 2px; bottom: 3px; padding: 0; background: var(--naru-ok-dot); }
  .body { display: flex; height: clamp(420px, calc(100vh - 230px), 640px); }
  .site { position: relative; flex: 1 1 auto; overflow: hidden; background: #2b2b2b; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .site__head { position: absolute; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; color: #bbb; font-size: 12px; background: #1c1c1c; }
  .site__head button { background: #333; color: #ddd; border: 0; border-radius: 4px; padding: 3px 10px; cursor: pointer; font: inherit; }
  .spread { position: relative; height: calc(100% - 64px); aspect-ratio: 2000 / 1342; margin-top: 32px; }
  .spread img { width: 100%; height: 100%; display: block; }
  .spread--2 img { transform: scaleX(-1); filter: sepia(.25); }
  .ov { position: absolute; padding: 4px 6px; background: #fff; border-radius: 10px; font-size: 12px; line-height: 1.35; color: #111; box-shadow: 0 0 0 1px rgba(0,0,0,.15); max-width: 16%; animation: fade .4s; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

  /* ---------- side panel（現有的，不在這次討論範圍） ---------- */
  .panel { flex: none; width: 320px; border-left: 1px solid #ccc; display: flex; flex-direction: column; background: #fff; }
  .panel__chrome { display: flex; justify-content: space-between; align-items: center; height: 34px; padding: 0 10px; background: #dfe3ea; font-size: 13px; }
  .panel__chrome button { border: 0; background: none; cursor: pointer; font-size: 16px; }
  .panel__body { padding: 14px; font-size: 13px; color: var(--naru-ink-2); display: grid; gap: 10px; align-content: start; }

  /* ---------- 共用小元件（照 tokens 的配色） ---------- */
  .btn { border: 1px solid var(--naru-line-strong); background: var(--naru-surface); color: var(--naru-ink); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn--primary { background: var(--naru-accent); border-color: var(--naru-accent); color: var(--naru-on-accent); font-weight: 700; }
  .btn--ghost { border-color: transparent; background: transparent; color: var(--naru-accent); padding: 4px 6px; }
  .seg { display: inline-flex; border: 1px solid var(--naru-line-strong); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--naru-surface); padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--naru-ink-2); }
  .seg button[aria-pressed='true'] { background: var(--naru-accent-weak); color: var(--naru-accent); font-weight: 700; }
  .callout { border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .callout--warn { background: var(--naru-warn-bg); color: var(--naru-warn); }
  .callout--danger { background: var(--naru-danger-bg); color: var(--naru-danger); }
  .callout--info { background: var(--naru-accent-weak); color: var(--naru-accent); }
  .progress { height: 4px; background: var(--naru-line); border-radius: 2px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--naru-highlight); transition: width .3s; }
  .progress--indet > i { width: 35%; animation: indet 1.1s infinite ease-in-out; }
  @keyframes indet { from { transform: translateX(-100%) } to { transform: translateX(290%) } }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -1px; }
  @keyframes rot { to { transform: rotate(360deg) } }
  .muted { color: var(--naru-ink-3); font-size: 12px; }

  /* ---------- A：全部「蓋」在 Page 上，不佔網站版面、不擋點擊 ---------- */
  .veil { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .veil > .progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; border-radius: 0; background: rgba(255,255,255,.2); }
  .veil__chip { position: absolute; top: 8px; right: 8px; padding: 3px 9px; border-radius: 999px; font-size: 12px; background: rgba(20,20,20,.75); color: #fff; white-space: nowrap; }
  .veil__chip--warn { background: #c0392b; pointer-events: auto; cursor: pointer; }
  .veil__chip--warn:hover { background: #a93226; }
  /* 圖示右鍵選單（模擬 Chrome 原生選單） */
  .ctx { position: absolute; top: 38px; right: 8px; z-index: 30; min-width: 240px; padding: 6px 0; background: #fff; border: 1px solid #ccd; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 13px; }
  .ctx button { display: flex; gap: 8px; width: 100%; padding: 6px 14px; border: 0; background: none; font: inherit; text-align: left; cursor: pointer; color: #222; }
  .ctx button:hover { background: #e8eef7; }
  .ctx button[disabled] { color: #999; cursor: default; background: none; }
  .ctx hr { border: 0; border-top: 1px solid #e3e3e3; margin: 5px 0; }
  .ctx__check { width: 14px; }
  .purpose { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .purpose button { display: grid; gap: 6px; text-align: left; padding: 16px; border: 1px solid var(--naru-line-strong); border-radius: 10px; background: #fff; font: inherit; cursor: pointer; }
  .purpose button:hover { border-color: var(--naru-accent); background: var(--naru-accent-weak); }
  .purpose strong { font-size: 16px; }

  /* ---------- B：action popup ---------- */
  .popup { position: absolute; top: 40px; right: 8px; z-index: 20; width: 320px; background: #fff; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); border: 1px solid #ccd; padding: 14px; display: grid; gap: 12px; font-size: 13px; }
  .popup h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .popup h3 img { width: 18px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pagestat { display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--naru-line); border-radius: 8px; }

  /* ---------- C：頁面上的膠囊 ---------- */
  .pill { position: absolute; right: 16px; bottom: 16px; z-index: 10; font-size: 13px; }
  .pill__btn { display: flex; align-items: center; gap: 8px; border: 0; cursor: pointer; padding: 8px 14px; border-radius: 999px; background: rgba(31,29,26,.88); color: #fff; font: inherit; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .pill__btn--dot { width: 38px; height: 38px; padding: 0; justify-content: center; opacity: .55; }
  .pill__btn--dot:hover { opacity: 1; }
  .pill__btn--dot img { width: 20px; filter: invert(1); }
  .pill__btn--warn { background: #8c1d18; }
  .pill__menu { position: absolute; right: 0; bottom: 48px; width: 260px; background: #fff; color: var(--naru-ink); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 12px; display: grid; gap: 10px; }

  /* ---------- 整頁（onboarding 跳到某一步） ---------- */
  .full { flex: 1; padding: 48px; background: var(--naru-surface-2); overflow: auto; }
  .full__card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px; display: grid; gap: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .full__card h2 { margin: 0; font-size: 20px; }
  .full__card input { padding: 8px 10px; border: 1px solid var(--naru-line-strong); border-radius: 8px; font: inherit; }
</style>
</head>
<body>
<div class="pt-bar" id="bar"></div>
<div class="pt-note" id="note"></div>
<div class="pt-dump" id="dump"></div>
<div class="pt-stage"><div class="win" id="win"></div></div>
<div class="pt-switcher" role="group" aria-label="切換版本">
  <button type="button" id="prev" aria-label="上一個版本">←</button>
  <span id="variant-label"></span>
  <button type="button" id="next" aria-label="下一個版本">→</button>
</div>

<script>
// ========================= 版本與情境 =========================
const params = new URLSearchParams(location.search);
const VARIANTS = {
  A: '一點就翻・狀態蓋在 Page 上',
  B: '一點先出選單（action popup）',
  C: '一點就翻・頁面上浮一顆膠囊',
};
const NOTES = {
  A: '點圖示是開關：沒啟動→啟動並翻譯（「啟動時打開側邊欄」勾著就一起開）；已啟動→停止翻譯並關掉側邊欄。要不要側邊欄在 onboarding 選、之後在圖示右鍵改，右鍵也能臨時打開側邊欄。狀態只用圖示 badge 和蓋在 Page 頂端的細進度條、右上角小標籤；出問題時小標籤可以點（查看方案／登入／重試）。',
  B: '點圖示＝打開 action popup（Chrome 開 popup 時一樣給 activeTab）。popup 裡按「翻譯」才啟動；狀態、Page Mode、停止、開側邊欄都在 popup。從 popup 按鈕呼叫 sidePanel.open() 有 user gesture。代價：多一次點擊，快捷鍵要改成 _execute_action。',
  C: '點圖示＝啟動並翻譯，同時在漫畫頁右下角放一顆膠囊顯示狀態；平常縮成半透明圓點，點開是小選單。⚠ 待驗證：從網頁上的按鈕經訊息呼叫 sidePanel.open() 可能沒有 user gesture，「打開側邊欄」也許只能提示去點圖示。',
};
const SCENARIOS = {
  normal: '一般（已登入、剩 37 頁）',
  firstUse: '第一次用：模型還沒下載',
  signedOut: '啟動時沒登入',
  quotaMid: '看到一半額度用完（剩 1 頁）',
  fail: '第 2 跨頁翻譯失敗',
};
let variant = VARIANTS[params.get('variant')] ? params.get('variant') : 'A';
let scenario = SCENARIOS[params.get('scenario')] ? params.get('scenario') : 'normal';

// 示意的覆蓋層：比例座標＋譯文（兩個跨頁共用，第 2 跨頁左右對調）
const OVERLAYS = [
  { x: 84, y: 4, t: '突然出現的巨大黑影——' },
  { x: 64, y: 16, t: '街道……正在崩毀……！' },
  { x: 84, y: 38, t: '怎麼會……！我們的攻擊完全沒用！' },
  { x: 84, y: 62, t: '……不，還沒結束。' },
  { x: 38, y: 6, t: '喔喔喔喔喔喔！！' },
  { x: 26, y: 30, t: '在這裡退縮的話……就沒有明天了！！' },
  { x: 4, y: 60, t: '那傢伙……難道！？' },
];

// ========================= 狀態 =========================
let gen = 0; // 重設時讓舊的 setTimeout 失效
let S;
// Side Panel on Activation：全域設定，換情境、重來都不會清掉
let panelOnActivate = false;
function reset() {
  gen++;
  S = {
    active: false,
    page: 1, // 第幾跨頁
    pages: {}, // n -> { status: idle|waiting-model|translating|done|blocked|error, stage }
    signedIn: scenario !== 'signedOut',
    quota: scenario === 'quotaMid' ? 1 : 37,
    modelReady: scenario !== 'firstUse',
    modelPct: 0,
    downloading: false,
    failOnce: scenario === 'fail',
    sidePanel: false,
    ctx: false, // 圖示右鍵選單
    pageMode: '閱讀',
    popup: false,
    pill: false,
    pillOpen: false,
    tabs: ['manga'],
    tab: 'manga',
    fullKind: null, // signedOut | quota
    fullDone: false,
  };
}
reset();

const pageOf = (n) => (S.pages[n] ??= { status: 'idle', stage: '' });
const cur = () => pageOf(S.page);

/** 這個分頁現在卡在什麼：帳號類（開整頁）或翻譯失敗（重試）。 */
function problem() {
  const all = Object.values(S.pages);
  if (all.some((p) => p.status === 'blocked')) return S.signedIn ? { kind: 'quota', text: '免費額度用完了' } : { kind: 'signedOut', text: '還沒登入' };
  const err = Object.entries(S.pages).find(([, p]) => p.status === 'error');
  if (err) return { kind: 'error', text: `第 ${err[0]} 跨頁翻譯失敗`, page: Number(err[0]) };
  return null;
}
const busy = () => Object.values(S.pages).some((p) => p.status === 'translating' || p.status === 'waiting-model');

// ========================= 模擬翻譯 =========================
function later(ms, fn) {
  const g = gen;
  setTimeout(() => g === gen && (fn(), render()), ms);
}

function translate(n) {
  const p = pageOf(n);
  if (['done', 'translating', 'waiting-model'].includes(p.status)) return;
  if (!S.signedIn || S.quota <= 0) return (p.status = 'blocked');
  if (!S.modelReady) {
    p.status = 'waiting-model';
    return startDownload();
  }
  p.status = 'translating';
  p.stage = '擷取畫面';
  later(600, () => (p.stage = '辨識文字'));
  later(1800, () => (p.stage = '翻譯中'));
  later(3600, () => {
    if (S.failOnce && n === 2) {
      S.failOnce = false;
      p.status = 'error';
      p.stage = '翻譯服務沒有回應';
      return;
    }
    p.status = 'done';
    S.quota--;
  });
}

function startDownload() {
  if (S.downloading) return;
  S.downloading = true;
  const step = () => {
    S.modelPct = Math.min(100, S.modelPct + 7);
    if (S.modelPct < 100) return later(300, step);
    S.modelReady = true;
    for (const [n, p] of Object.entries(S.pages)) if (p.status === 'waiting-model') (p.status = 'idle'), translate(Number(n));
  };
  later(300, step);
}

/** #93：能不能翻譯變了，已啟動分頁畫面上沒翻的頁直接翻。 */
function abilityChanged() {
  if (!S.active) return;
  for (const p of Object.values(S.pages)) if (p.status === 'blocked') p.status = 'idle';
  translate(S.page);
}

// ========================= 動作 =========================
function activate({ withPanel = panelOnActivate } = {}) {
  S.active = true;
  S.popup = false;
  if (withPanel) S.sidePanel = true;
  if (variant === 'C') S.pill = true;
  translate(S.page);
  const pr = problem();
  if (pr && pr.kind !== 'error') openFull(pr.kind); // Q3／Q8：啟動當下卡住就開整頁
}

function clickIcon() {
  if (variant === 'B') return (S.popup = !S.popup);
  if (!S.active) return activate();
  // A：圖示是開關，已啟動再點一次＝停止翻譯並關掉側邊欄
  if (variant === 'A') return stop();
  // 已啟動再點一次
  const pr = problem();
  if (pr && pr.kind !== 'error') openFull(pr.kind);
  else S.sidePanel = true;
}

function openFull(kind) {
  if (!S.tabs.includes('full')) S.tabs.push('full');
  S.tab = 'full';
  S.fullKind = kind;
  S.fullDone = false;
  S.popup = false;
  S.pillOpen = false;
}

function backToManga() {
  S.tabs = ['manga'];
  S.tab = 'manga';
  abilityChanged();
}

function turnPage() {
  S.page = S.page === 1 ? 2 : 1;
  S.pillOpen = false;
  if (S.active) translate(S.page);
}

function retry(n) {
  pageOf(n).status = 'idle';
  translate(n);
}

function stop() {
  S.active = false;
  S.pages = {};
  S.pill = false;
  S.pillOpen = false;
  S.popup = false;
  S.sidePanel = false;
}

// ========================= 畫面 =========================
function statusText(p) {
  switch (p.status) {
    case 'waiting-model': return `第一次使用：下載文字辨識模型 ${S.modelPct}%`;
    case 'translating': return `${p.stage}…`;
    case 'done': return '已翻譯';
    case 'blocked': return S.signedIn ? '額度用完，沒有翻譯' : '還沒登入，沒有翻譯';
    case 'error': return `翻譯失敗：${p.stage}`;
    default: return '還沒翻譯';
  }
}

function badge() {
  if (!S.active) return '';
  if (problem()) return '<span class="badge badge--warn">!</span>';
  if (busy()) return '<span class="badge badge--busy">…</span>';
  return '<span class="badge badge--on"></span>';
}

function overlays() {
  if (cur().status !== 'done' || S.pageMode !== '閱讀') return '';
  return OVERLAYS.map((o) => {
    const x = S.page === 2 ? 100 - o.x - 14 : o.x;
    return `<div class="ov" style="left:${x}%;top:${o.y}%">${o.t}</div>`;
  }).join('');
}

function progressBar(p) {
  if (p.status === 'waiting-model') return `<div class="progress"><i style="width:${S.modelPct}%"></i></div>`;
  if (p.status === 'translating') return '<div class="progress progress--indet"><i></i></div>';
  return '';
}

// A：蓋在 Page 頂端的細進度條＋右上角小標籤（pointer-events: none，網站照常操作）
function edgeA() {
  if (variant !== 'A' || !S.active) return '';
  const p = cur();
  const pr = problem();
  const working = p.status === 'waiting-model' || p.status === 'translating';
  let chip = '';
  if (working) chip = `<span class="veil__chip"><span class="spin"></span> ${statusText(p)}</span>`;
  else if (pr) {
    const [act, label] = pr.kind === 'error' ? [`retry:${pr.page}`, '重試'] : [`full:${pr.kind}`, pr.kind === 'quota' ? '查看方案' : '登入'];
    chip = `<span class="veil__chip veil__chip--warn" role="button" data-act="${act}">${pr.text}・${label}</span>`;
  }
  return `<div class="veil">${progressBar(p)}${chip}</div>`;
}

const pageModeSeg = () =>
  `<div class="seg" role="group" aria-label="Page Mode">${['閱讀', '學習'].map((m) => `<button data-act="mode:${m}" aria-pressed="${S.pageMode === m}">${m}</button>`).join('')}</div>`;

function problemAction(pr) {
  if (!pr) return '';
  if (pr.kind === 'error') return `<div class="callout callout--danger row"><span>${pr.text}</span><button class="btn" data-act="retry:${pr.page}">重試</button></div>`;
  const label = pr.kind === 'quota' ? '查看方案' : '登入';
  return `<div class="callout callout--warn row"><span>${pr.text}</span><button class="btn" data-act="full:${pr.kind}">${label}</button></div>`;
}

// 圖示右鍵選單：自己的項目在上，Chrome 原生的在下（灰字示意）
function ctxMenu() {
  if (!S.ctx) return '';
  return `<div class="ctx" role="menu">
    <button data-act="toggle-panel-setting"><span class="ctx__check">${panelOnActivate ? '✓' : ''}</span>啟動時打開側邊欄</button>
    <button data-act="ctx-panel"><span class="ctx__check"></span>打開側邊欄</button>
    <hr>
    <button disabled><span class="ctx__check"></span>Naruhodo</button>
    <button disabled><span class="ctx__check"></span>從工具列取消固定</button>
    <button disabled><span class="ctx__check"></span>管理擴充功能</button>
  </div>`;
}

// B：action popup
function popupB() {
  if (variant !== 'B' || !S.popup) return '';
  const head = `<h3><img src="../icons/naruhodo.svg" alt="">Naruhodo</h3>`;
  if (!S.active) {
    return `<div class="popup">${head}
      <button class="btn btn--primary" data-act="activate">翻譯這個分頁</button>
      <button class="btn" data-act="activate-panel">翻譯並打開側邊欄（看原文與讀音）</button>
      <div class="row"><span>頁面顯示</span>${pageModeSeg()}</div>
      <span class="muted">剩 ${S.quota} 頁・快捷鍵 Alt+Shift+M 也能打開這裡</span>
    </div>`;
  }
  const p = cur();
  return `<div class="popup">${head}
    <div class="pagestat"><div class="row"><strong>第 ${S.page} 跨頁</strong><span class="muted">${p.status === 'translating' || p.status === 'waiting-model' ? '<span class="spin"></span> ' : ''}${statusText(p)}</span></div>${progressBar(p)}</div>
    ${problemAction(problem())}
    <div class="row"><span>頁面顯示</span>${pageModeSeg()}</div>
    <div class="row"><button class="btn" data-act="panel">打開側邊欄</button><button class="btn btn--ghost" data-act="stop">停止翻譯</button></div>
    <span class="muted">剩 ${S.quota} 頁</span>
  </div>`;
}

// C：頁面上的膠囊
function pillC() {
  if (variant !== 'C' || !S.pill) return '';
  const p = cur();
  const pr = problem();
  let btn;
  if (pr) btn = `<button class="pill__btn pill__btn--warn" data-act="pill">⚠ ${pr.text}</button>`;
  else if (p.status === 'translating' || p.status === 'waiting-model') btn = `<button class="pill__btn" data-act="pill"><span class="spin"></span> ${statusText(p)}</button>`;
  else btn = `<button class="pill__btn pill__btn--dot" data-act="pill" aria-label="Naruhodo"><img src="../icons/naruhodo.svg" alt=""></button>`;
  const menu = S.pillOpen
    ? `<div class="pill__menu">
        ${problemAction(pr)}
        <div class="row"><strong>第 ${S.page} 跨頁</strong><span class="muted">${statusText(p)}</span></div>
        <div class="row"><span>頁面顯示</span>${pageModeSeg()}</div>
        <div class="row"><button class="btn" data-act="panel">打開側邊欄*</button><button class="btn btn--ghost" data-act="stop">停止翻譯</button></div>
        <span class="muted">剩 ${S.quota} 頁・*需驗證 user gesture</span>
      </div>`
    : '';
  return `<div class="pill">${menu}${btn}</div>`;
}

function sidePanel() {
  if (!S.sidePanel) return '';
  const p = cur();
  return `<aside class="panel"><div class="panel__chrome"><span>Naruhodo（現有側邊欄，示意）</span><button data-act="close-panel" aria-label="關閉">×</button></div>
    <div class="panel__body">${problemAction(problem())}<div>第 ${S.page} 跨頁：${statusText(p)}</div>${progressBar(p)}<div class="muted">逐句原文、讀音、譯文……（照舊）</div><div class="muted">圖示右鍵可以改「啟動時打開側邊欄」</div></div></aside>`;
}

function fullPage() {
  const k = S.fullKind;
  let card;
  if (k === 'purpose') {
    card = S.fullDone
      ? `<h2>設定好了</h2><p>${panelOnActivate ? '點圖示時會一起打開側邊欄，頁面顯示：學習。' : '點圖示只會翻譯，不開側邊欄，頁面顯示：閱讀。'}</p><p class="muted">之後在外掛圖示上按右鍵可以改「啟動時打開側邊欄」。</p><button class="btn btn--primary" data-act="back">下一步（示意：回到漫畫）</button>`
      : `<h2>你想怎麼用 Naruhodo？</h2><div class="purpose">
          <button data-act="purpose:read"><strong>看漫畫</strong><span class="muted">對話框直接換成中文，不開側邊欄。</span></button>
          <button data-act="purpose:learn"><strong>學日文</strong><span class="muted">保留日文原文，側邊欄列出讀音與譯文。</span></button>
        </div><p class="muted">之後隨時可以在圖示右鍵改。</p>`;
  } else if (S.fullDone) {
    card = `<h2>${k === 'quota' ? '訂閱完成' : '登入完成'}</h2><p>剩 ${S.quota} 頁。回到漫畫後會自動接著翻譯，不用再點一次圖示。</p><button class="btn btn--primary" data-act="back">回到漫畫</button>`;
  } else if (k === 'signedOut') {
    card = `<h2>登入以使用內建翻譯</h2><p class="muted">你剛剛在漫畫網站點了 Naruhodo。登入後就會開始翻譯那一頁。</p><input value="reader@example.com" aria-label="Email"><button class="btn btn--primary" data-act="signin">寄驗證碼並登入（模擬）</button><button class="btn btn--ghost" data-act="back">先回到漫畫</button>`;
  } else {
    card = `<h2>免費額度用完了</h2><p class="muted">已翻譯的頁面照樣看得到；訂閱後會接著翻譯剛剛那一頁。</p><button class="btn btn--primary" data-act="subscribe">訂閱（年繳，模擬）</button><button class="btn btn--ghost" data-act="back">先回到漫畫</button>`;
  }
  return `<div class="full"><div class="full__card">${card}</div></div>`;
}

function render() {
  // 控制列
  document.getElementById('bar').innerHTML =
    '<strong>情境</strong>' +
    Object.entries(SCENARIOS).map(([k, v]) => `<button data-scenario="${k}" aria-pressed="${k === scenario}">${v}</button>`).join('') +
    '<button data-act="reset">重來</button><button data-act="full:purpose">看 onboarding 那一題</button>';
  document.getElementById('note').textContent = NOTES[variant];
  document.getElementById('variant-label').textContent = `${variant}（${VARIANTS[variant]}）`;
  document.getElementById('dump').textContent = JSON.stringify({
    active: S.active, page: S.page, pages: S.pages, signedIn: S.signedIn, quota: S.quota, model: S.modelReady ? 'ready' : `${S.modelPct}%`,
    sidePanel: S.sidePanel, panelOnActivate, pageMode: S.pageMode, tab: S.tab, problem: problem()?.kind ?? null,
  });

  const tabTitle = (t) => (t === 'manga' ? `漫畫網站 — 第 ${S.page} 跨頁` : 'Naruhodo');
  const url = S.tab === 'manga' ? `https://manga.example.com/episode/12` : 'chrome-extension://naruhodo/onboarding.html';
  const main =
    S.tab === 'manga'
      ? `<div class="site" data-act="site">
          <div class="site__head"><span>漫畫網站（示意）</span><button data-act="turn">${S.page === 1 ? '下一頁 →' : '← 上一頁'}</button></div>
          <div class="spread ${S.page === 2 ? 'spread--2' : ''}"><img src="../../practice-spread/practice-spread.webp" alt="">${overlays()}${edgeA()}</div>
          ${pillC()}
        </div>${sidePanel()}`
      : fullPage();
  document.getElementById('win').innerHTML = `
    <div class="tabs">${S.tabs.map((t) => `<div class="tab" data-tab="${t}" aria-selected="${S.tab === t}">${tabTitle(t)}</div>`).join('')}</div>
    <div class="toolbar"><div class="url">${url}</div>
      <button class="ext" data-act="icon" title="漫畫翻譯：在這個分頁啟動"><img src="../icons/naruhodo.svg" alt="Naruhodo">${badge()}</button>
      ${popupB()}${ctxMenu()}
    </div>
    <div class="body">${main}</div>`;
}

// ========================= 事件 =========================
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act],[data-scenario],[data-tab]');
  if (S.ctx && !e.target.closest('.ctx')) {
    S.ctx = false;
    render();
    if (el?.dataset.act === 'icon') return;
  }
  if (!el) return;
  if (el.dataset.scenario) {
    scenario = el.dataset.scenario;
    setParam('scenario', scenario);
    reset();
    return render();
  }
  if (el.dataset.tab) {
    S.tab = el.dataset.tab;
    return render();
  }
  const [act, arg] = el.dataset.act.split(':');
  // 點網頁本身：popup 跟著失焦關掉
  if (act === 'site') {
    if (e.target === el || e.target.tagName === 'IMG') (S.popup = false), (S.pillOpen = false);
    return render();
  }
  e.stopPropagation();
  ({
    reset: () => reset(),
    icon: clickIcon,
    activate: () => activate({ withPanel: false }),
    'activate-panel': () => activate({ withPanel: true }),
    turn: turnPage,
    mode: () => (S.pageMode = arg),
    panel: () => ((S.sidePanel = true), (S.popup = false), (S.pillOpen = false)),
    'close-panel': () => (S.sidePanel = false),
    stop,
    retry: () => retry(Number(arg)),
    full: () => openFull(arg),
    back: backToManga,
    pill: () => (S.pillOpen = !S.pillOpen),
    signin: () => ((S.signedIn = true), (S.quota = 50), (S.fullDone = true)),
    subscribe: () => ((S.quota = 1000), (S.fullDone = true)),
    'toggle-panel-setting': () => ((panelOnActivate = !panelOnActivate), (S.ctx = false)),
    // contextMenus.onClicked 有 user gesture，可以呼叫 sidePanel.open()；還沒啟動就順便啟動
    'ctx-panel': () => ((S.ctx = false), S.active ? (S.sidePanel = true) : activate({ withPanel: true })),
    purpose: () => {
      panelOnActivate = arg === 'learn';
      S.pageMode = arg === 'learn' ? '學習' : '閱讀';
      S.fullDone = true;
    },
  })[act]?.();
  render();
});

function setParam(k, v) {
  const u = new URL(location.href);
  u.searchParams.set(k, v);
  history.replaceState(null, '', u);
}
function cycle(d) {
  const keys = Object.keys(VARIANTS);
  variant = keys[(keys.indexOf(variant) + d + keys.length) % keys.length];
  setParam('variant', variant);
  reset();
  render();
}
document.addEventListener('contextmenu', (e) => {
  if (!e.target.closest('.ext')) return;
  e.preventDefault();
  S.ctx = true;
  S.popup = false;
  render();
});
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
</body>
</html>
